# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "ps2-host"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "SDL3 host backend for the PS2 recompiler runtime (C ABI)"
publish = false

[lib]
name = "ps2_host"
# staticlib for linking into the C++ runtime; cdylib for standalone testing.
crate-type = ["staticlib", "cdylib"]

[dependencies]
sdl3-sys = "0.6.6"

[profile.release]
opt-level = 3
lto = true
